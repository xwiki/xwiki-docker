// The tasks that refresh the version data model in 'versions.json': the XWiki version of each cycle, the JDBC driver
// versions of each cycle, and the shared LibreOffice version. They all resolve the values from the same places XWiki
// itself uses and compute the sha256 of the artifacts the images download, so that no version or hash has to be found,
// downloaded and pasted by hand. Run './gradlew' afterwards to regenerate the images (or use the 'release' umbrella,
// which chains everything in the right order).

// The version data model (see build.gradle) and the shared helpers (see gradle/helpers.gradle), bound at configuration
// time rather than read from the project inside the task actions below (see build.gradle).
def tokens = project.tokens
def versionsConfig = project.versionsConfig
def writeVersions = project.writeVersions
def httpGetText = project.httpGetText
def sha256OfUrl = project.sha256OfUrl
def compareVersions = project.compareVersions

// How the update tasks tell a 'smokeTest' chained in the same invocation (the 'release' umbrella) what is worth
// booting: 'ran' distinguishes "no update task ran, so test everything" from "one ran and nothing changed, so there is
// nothing to test", 'changedCycles' collects the cycles whose XWiki version or JDBC drivers changed, and 'allCycles' is
// set when LibreOffice changed, since that one regenerates every cycle at once. 'changedDatabases' maps a cycle to the
// databases whose JDBC driver moved, so that 'smokeTest' boots the variant a driver bump is about rather than only its
// default one: a driver crossing a major (the MySQL connector going from 9.x to 26.x, say) is exactly the change worth
// booting, and nothing else in the build ever connects XWiki to that database. A shared mutable holder rather than an
// extra property written at execution time, since writing one means reaching for the project from a task action.
def versionUpdate = [ran: false, changedCycles: new LinkedHashSet(), changedDatabases: [:], allCycles: false]
ext.versionUpdate = versionUpdate

// Resolve, for each existing cycle, the latest final XWiki version on that cycle's line (18 -> latest 18.x, 18.4 ->
// latest 18.4.x, ...) from XWiki's Maven metadata, and for any cycle whose version changed, download the WAR, compute
// its sha256, and rewrite the values in 'versions.json'. Does NOT create new cycles (adding a cycle stays a manual
// 'versions.json' edit, since it also means deciding its role and its base image).
task updateXWiki() {
    group = 'release'
    description = 'Updates each cycle in versions.json to the latest final XWiki version released on its line.'
    doLast {
        // Resolve the versions from maven.xwiki.org, the same repository the generated Dockerfile downloads the WAR
        // from (see XWIKI_URL_PREFIX in template/Dockerfile), so that the sha256 computed below is that of the exact
        // bytes the image will fetch rather than of a copy assumed to be identical. The metadata lists RCs, hence the
        // finals-only filter below.
        def repositoryUrl = 'https://maven.xwiki.org/releases/org/xwiki/platform/xwiki-platform-distribution-war/'
        def metadataUrl = "${repositoryUrl}maven-metadata.xml"
        def metadata = httpGetText(metadataUrl)
        def finals = []
        (metadata =~ /<version>([^<]+)<\/version>/).each { full, v ->
            if (v ==~ /\d+\.\d+\.\d+/) {
                finals << v
            }
        }
        if (finals.isEmpty()) {
            throw new GradleException("No final XWiki versions found at [$metadataUrl]")
        }
        // The 'major.minor' a version sits on, which is what decides whether two cycles claim the same tags: a cycle
        // keyed by a bare major publishes its resolved major.minor as a tag just as a cycle keyed by a major.minor
        // publishes its own.
        def versionLine = { String v -> v.tokenize('.').take(2).join('.') }
        def changed = []
        tokens.each { cycle, data ->
            def parts = cycle.tokenize('.')
            def matching = finals.findAll { fv ->
                def fparts = fv.tokenize('.')
                parts.size() <= fparts.size() && (0..<parts.size()).every { fparts[it] == parts[it] }
            }
            if (matching.isEmpty()) {
                logger.lifecycle("No final XWiki version found for cycle ${cycle}; skipping.")
                return
            }
            def latest = matching.max { a, b -> compareVersions(a, b) }
            if (latest == data.xwikiVersion) {
                logger.lifecycle("XWiki cycle ${cycle} is already up to date (${data.xwikiVersion}).")
                return
            }
            // Never go backwards. The pinned version being ahead of everything the metadata lists means the metadata
            // lost it (a release pulled for being broken, a repository half synced), and downgrading a cycle to an
            // older XWiki is not a decision this task gets to make silently: it would rebuild and republish the
            // official images backwards. Same rule as the JDBC drivers below, for the same reason.
            if (compareVersions(latest, data.xwikiVersion) < 0) {
                logger.lifecycle("XWiki cycle ${cycle}: the latest final version listed is ${latest}, keeping the " +
                    "pinned ${data.xwikiVersion} which is ahead of it.")
                return
            }
            // Never put two cycles on the same version line either. The tags a cycle publishes are derived from its
            // version, so two cycles sharing a major.minor claim the same ones, which docker-library rejects - and the
            // build refuses to configure at all in that state (see the duplicate tag check in
            // gradle/official-image.gradle). Writing it here would therefore leave every later './gradlew' failing,
            // 'generate' included, until 'versions.json' is edited by hand. It is reachable: the stable cycle resolves
            // to the latest final of its whole major, which is still on the line an intermediate LTS cycle owns until
            // the next minor is released. Keeping the pin is the right answer there, since that intermediate LTS cycle
            // is already publishing that version.
            def colliding = tokens.find { c, d -> c != cycle && versionLine(d.xwikiVersion) == versionLine(latest) }
            if (colliding) {
                logger.lifecycle("XWiki cycle ${cycle}: the latest final version listed is ${latest}, which is on " +
                    "the same version line as cycle ${colliding.key} (${colliding.value.xwikiVersion}); keeping " +
                    "${data.xwikiVersion}. Both cycles would otherwise publish the same tags.")
                return
            }
            def warUrl = "${repositoryUrl}${latest}/xwiki-platform-distribution-war-${latest}.war"
            logger.lifecycle("Updating XWiki cycle ${cycle} from ${data.xwikiVersion} to ${latest} " +
                '(downloading the WAR to compute its sha256, this may take a while)...')
            def sha = sha256OfUrl(warUrl)
            data.xwikiVersion = latest
            data.xwikiSha256 = sha
            changed << cycle
        }
        if (!changed.isEmpty()) {
            writeVersions()
            logger.lifecycle("Updated XWiki version for cycle(s): ${changed.join(', ')}.")
            // Only worth saying when something moved: nothing to regenerate otherwise, and 'release' regenerates on
            // its own anyway.
            logger.lifecycle("Run './gradlew' to regenerate the images.")
        }
        // Record the changed cycles so that a chained 'smokeTest' (in the 'release' umbrella) knows what to test.
        versionUpdate.ran = true
        versionUpdate.changedCycles.addAll(changed)
    }
}

// For each existing cycle, read the JDBC driver versions declared in that cycle's own xwiki-platform POM (the versions
// XWiki was tested against) and, for any that changed, download the driver JAR from Maven Central, compute its sha256,
// and rewrite the per-cycle values in 'versions.json'.
//
// The POM value is a floor, not an exact target: it is never applied when it is lower than what is currently pinned. A
// pin ahead of the POM is a deliberate bump made after that cycle was released (a security fix, or a Renovate
// upgrade), and taking the POM value literally would silently revert it and rebuild the images for nothing. Upgrades
// are applied, including the ones crossing a driver major (the MySQL connector jumping
// from 9.x to 26.x, say), but they are logged as such since the release manager reviews the diff before committing it.
task updateJDBC() {
    group = 'release'
    description = 'Updates the JDBC drivers of each cycle to the ones its own xwiki-platform POM declares.'
    doLast {
        def drivers = [
            [name: 'mysql', prop: 'mysql.version', path: 'com/mysql/mysql-connector-j',
             jar: { v -> "mysql-connector-j-${v}.jar" },
             tokenV: 'mysqlJDBCVersion', tokenS: 'mysqlJDBCSha256'],
            [name: 'mariadb', prop: 'mariadb.version', path: 'org/mariadb/jdbc/mariadb-java-client',
             jar: { v -> "mariadb-java-client-${v}.jar" },
             tokenV: 'mariadbJDBCVersion', tokenS: 'mariadbJDBCSha256'],
            [name: 'postgres', prop: 'pgsql.version', path: 'org/postgresql/postgresql',
             jar: { v -> "postgresql-${v}.jar" },
             tokenV: 'postgresJDBCVersion', tokenS: 'postgresJDBCSha256']
        ]
        def changed = new LinkedHashSet()
        def changedDatabases = [:]
        tokens.each { cycle, data ->
            def version = data.xwikiVersion
            // Read the JDBC driver versions from the cycle's own xwiki-platform POM on maven.xwiki.org. The driver JARs
            // themselves are hashed from Maven Central below, because that is where the generated Dockerfile downloads
            // them from (see template/Dockerfile).
            def pomUrl = 'https://maven.xwiki.org/releases/org/xwiki/platform/xwiki-platform/' +
                "${version}/xwiki-platform-${version}.pom"
            def pom = httpGetText(pomUrl)
            drivers.each { d ->
                // The property name is quoted, since the '.' it contains is a regex metacharacter matching any
                // character, and a POM property is looked up by its name and not by something merely close to it.
                def property = java.util.regex.Pattern.quote(d.prop)
                def matcher = (pom =~ /<${property}>([^<]+)<\/${property}>/)
                if (!matcher.find()) {
                    throw new GradleException("Could not find <${d.prop}> in [$pomUrl]")
                }
                def pomVersion = matcher.group(1)
                def pinnedVersion = data[d.tokenV]
                if (pomVersion == pinnedVersion) {
                    logger.lifecycle("Cycle ${cycle}: ${d.name} JDBC already up to date (${pomVersion}).")
                    return
                }
                if (compareVersions(pomVersion, pinnedVersion) < 0) {
                    logger.lifecycle("Cycle ${cycle}: ${d.name} JDBC POM declares ${pomVersion}, keeping the pinned " +
                        "${pinnedVersion} which is ahead of it.")
                    return
                }
                def majorChange = pomVersion.tokenize('.')[0] != pinnedVersion.tokenize('.')[0]
                def jarUrl = "https://repo1.maven.org/maven2/${d.path}/${pomVersion}/${d.jar(pomVersion)}"
                logger.lifecycle("Cycle ${cycle}: ${d.name} JDBC ${pinnedVersion} -> ${pomVersion}" +
                    "${majorChange ? ' (new driver major, review it)' : ''} (hashing jar)...")
                def sha = sha256OfUrl(jarUrl)
                data[d.tokenV] = pomVersion
                data[d.tokenS] = sha
                changed << cycle
                changedDatabases.computeIfAbsent(cycle) { new LinkedHashSet() } << d.name
            }
        }
        if (!changed.isEmpty()) {
            writeVersions()
            logger.lifecycle("Updated the JDBC driver(s) of cycle(s): ${changed.join(', ')}.")
            logger.lifecycle("Run './gradlew' to regenerate the images.")
        }
        // Record the changed cycles so that a chained 'smokeTest' (in the 'release' umbrella) knows what to test: a
        // driver bump regenerates the images of that cycle just as an XWiki bump does, and is just as worth booting -
        // the variant of the database whose driver moved in particular, hence the per-database detail.
        versionUpdate.ran = true
        versionUpdate.changedCycles.addAll(changed)
        changedDatabases.each { cycle, databases ->
            versionUpdate.changedDatabases.computeIfAbsent(cycle) { new LinkedHashSet() }.addAll(databases)
        }
    }
}

// Resolve the LibreOffice version to pin (the LTS one, i.e. the latest patch of the previous stable branch) and its
// per-architecture sha256 from the Document Foundation, then rewrite the 'libreoffice' values in 'versions.json'. This
// mirrors how XWiki resolves 'libreoffice.version=lts' at test time (see LibreOfficeResolver in
// xwiki-platform-test-docker) but bakes a concrete, sha256-verified value into the data file so that image generation
// stays reproducible.
task updateLibreOffice() {
    group = 'release'
    description = 'Updates versions.json to the LibreOffice version XWiki supports, i.e. the LTS one.'
    doLast {
        def stableUrl = 'https://download.documentfoundation.org/libreoffice/stable/'
        def listing = httpGetText(stableUrl)

        // Parse the version directories (e.g. "25.8.7/") into major/minor/patch.
        def versions = []
        (listing =~ /href="(\d+)\.(\d+)\.(\d+)\/"/).each { full, major, minor, patch ->
            versions << [major: major as int, minor: minor as int, patch: patch as int]
        }
        if (versions.isEmpty()) {
            throw new GradleException("Failed to find any LibreOffice version at [$stableUrl]")
        }

        // Group into distinct branches (major.minor) sorted ascending; the LTS is the previous branch (second to last).
        def branches = versions.collect { [it.major, it.minor] }.unique(false).sort { a, b ->
            (a[0] <=> b[0]) ?: (a[1] <=> b[1])
        }
        if (branches.size() < 2) {
            throw new GradleException("Expected at least 2 LibreOffice branches at [$stableUrl] to determine the LTS")
        }
        def ltsBranch = branches[branches.size() - 2]

        // Keep the latest patch of the LTS branch.
        def lts = versions.findAll { it.major == ltsBranch[0] && it.minor == ltsBranch[1] }.max { it.patch }
        def newVersion = "${lts.major}.${lts.minor}.${lts.patch}"

        // Read the sha256 the Document Foundation publishes next to each archive (format: "<sha256>  <filename>").
        def resolveSha256 = { String archDir, String archFile ->
            def url = "${stableUrl}${newVersion}/deb/${archDir}/" +
                "LibreOffice_${newVersion}_Linux_${archFile}_deb.tar.gz.sha256"
            return httpGetText(url).trim().split(/\s+/)[0]
        }
        def newSha256Amd64 = resolveSha256('x86_64', 'x86-64')
        def newSha256Arm64 = resolveSha256('aarch64', 'aarch64')

        // The LibreOffice version is shared by every cycle, so a change to it regenerates them all and a chained
        // 'smokeTest' (in the 'release' umbrella) has to boot them all rather than only the ones bumped elsewhere.
        versionUpdate.ran = true

        def oldVersion = versionsConfig.libreoffice.version
        if (newVersion == oldVersion) {
            // The archives of a version already pinned must hash to what is pinned for it. A sha256 that moved while
            // the version did not means the Document Foundation is serving different bytes under a version this
            // repository has already published images for, which is exactly what pinning a hash exists to detect - so
            // it is reported as the supply chain event it is rather than quietly adopted. Accepting the new hash would
            // republish every image on bytes nobody looked at, and say 'Updated the sha256' while doing it. Resolve it
            // by hand: establish what happened upstream, then either edit the values in 'versions.json' or move the
            // pin to another version.
            def moved = [amd64: [versionsConfig.libreoffice.sha256Amd64, newSha256Amd64],
                arm64: [versionsConfig.libreoffice.sha256Arm64, newSha256Arm64]].findAll { arch, shas ->
                    shas[0] != shas[1]
                }
            if (!moved.isEmpty()) {
                throw new GradleException('The sha256 published for the pinned LibreOffice version ' +
                    "${newVersion} no longer matches the one in [versions.json]:\n" +
                    moved.collect { arch, shas -> "  ${arch}: pinned ${shas[0]}, published ${shas[1]}" }.join('\n') +
                    "\nThe archives served for that version have changed. Establish why before touching the pin.")
            }
            logger.lifecycle("LibreOffice is already up to date (${newVersion}).")
        } else {
            // Persist the values, and only then: rewriting 'versions.json' with what it already says would touch the
            // file on every run for nothing. Mutating the in-memory model also means that a 'generate' chained in the
            // same invocation (e.g. via the 'release' umbrella) picks up the new LibreOffice version.
            versionsConfig.libreoffice.version = newVersion
            versionsConfig.libreoffice.sha256Amd64 = newSha256Amd64
            versionsConfig.libreoffice.sha256Arm64 = newSha256Arm64
            writeVersions()
            versionUpdate.allCycles = true
            logger.lifecycle("Updated LibreOffice from ${oldVersion} to ${newVersion}.")
            logger.lifecycle("Run './gradlew' to regenerate the images with the pinned LibreOffice version.")
        }
    }
}
