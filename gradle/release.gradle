// Pre-push release umbrella: refresh the XWiki, JDBC and LibreOffice versions, regenerate all the images and the
// workflow, then smoke-test the cycles that changed. After this, review/commit/push docker-xwiki, then run
// './gradlew submitOfficialImage' to open the official Docker library Pull Request. This automates the "Update Docker
// Images" step of https://dev.xwiki.org/xwiki/bin/view/ReleasePlans/ReleasePlanHelp.
task release() {
    dependsOn 'updateXWiki', 'updateJDBC', 'updateLibreOffice', 'generate', 'generateWorkflows', 'smokeTest'
}

// Ordering so that a single 'release' invocation composes correctly: version updates first (JDBC after XWiki, since it
// reads each cycle's - possibly just-bumped - version), then generation, then the smoke tests. The update tasks mutate
// the in-memory version data model too, so the chained 'generate' sees the fresh values.
tasks.named('updateJDBC').configure { mustRunAfter('updateXWiki') }
tasks.named('updateLibreOffice').configure { mustRunAfter('updateXWiki', 'updateJDBC') }
tasks.named('generate').configure { mustRunAfter('updateXWiki', 'updateJDBC', 'updateLibreOffice') }
tasks.named('generateWorkflows').configure { mustRunAfter('updateXWiki', 'updateJDBC', 'updateLibreOffice') }
// 'smokeTest' also orders after the update tasks themselves, and not only after the 'generate' they order before, so
// that it still sees what they changed when it is chained without 'generate' (e.g. './gradlew updateJDBC smokeTest').
tasks.named('smokeTest').configure {
    mustRunAfter('generate', 'updateXWiki', 'updateJDBC', 'updateLibreOffice')
}
