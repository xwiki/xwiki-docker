// Generation of the DockerHub official images definition for xwiki (the 'library/xwiki' file of
// https://github.com/docker-library/official-images) from the version data model, and the task that submits it as a
// Pull Request against that repository.

// The version data model (see build.gradle), the 'capture' helper (see gradle/helpers.gradle) and the command line
// flags, bound at configuration time rather than read from the project inside the task action below (see build.gradle).
def tokens = project.tokens
def capture = project.capture
def dryRun = project.hasProperty('dryRun')
// '-PskipCiCheck' waives the Docker Build check below. The images this submits are built by the Docker Build workflow
// first, and that workflow downloads hundreds of megabytes from maven.xwiki.org and download.documentfoundation.org, so
// it goes red on a transient network failure often enough that a release cannot be held hostage to it.
def skipCiCheck = project.hasProperty('skipCiCheck')

// The DB variants and their short names as used in the official Docker library file. The first entry is the default
// variant (the one that also gets the version-only and role-global tags), and the order is the one the blocks are
// emitted in - which is why this is a list of its own rather than a view of the generated variants.
def dbVariants = [
    'mysql-tomcat': 'mysql',
    'postgres-tomcat': 'postgres',
    'mariadb-tomcat': 'mariadb'
]

// Which is also why it has to be kept in step by hand, and therefore checked: a variant added to build.gradle but not
// here would be generated, committed and built by CI, yet silently never make it into the file that publishes it, so
// the images would simply not exist on DockerHub.
def imageVariants = project.imageVariants
if (dbVariants.keySet() != (imageVariants as Set)) {
    throw new GradleException("The variants of the official Docker library file ${dbVariants.keySet()} do not match " +
        "the generated ones ${imageVariants}. A variant needs its short name and its place in the emitted order " +
        'declared in gradle/official-image.gradle too.')
}

// Constants of the official Docker library file. These match the header currently published for xwiki and rarely
// change.
def libraryMaintainers = 'XWiki Core Dev Team <committers@xwiki.org> (@xwiki)'
// This repository, and the canonical URL derived from it. The published file still names xwiki-contrib/docker-xwiki,
// which resolves only through the redirect GitHub kept when the repository moved to the xwiki organisation - and that
// redirect goes away the day anything else is created under the old name, taking the official image builds with it. So
// this submits the current URL, which is the one difference between what is generated here and what is published today.
def sourceRepo = 'xwiki/xwiki-docker'
def libraryGitRepo = "https://github.com/${sourceRepo}.git"
def libraryArchitectures = 'amd64, arm64v8'
def officialImagesRepo = 'docker-library/official-images'
def libraryPath = 'library/xwiki'
// The workflow that builds the images of this repository, i.e. the one whose verdict says whether what is submitted
// below builds at all.
def imageWorkflow = 'docker-build.yml'
// The branch of GitRepo that docker-library fetches the emitted GitCommit(s) from. The library file declares no
// 'GitFetch', so they take the default, 'refs/heads/master'.
def libraryGitBranch = 'master'

// The repository the Pull Request is opened against. 'docker-library/official-images' for a real submission, and
// '-PtargetRepo=<you>/official-images' to rehearse the whole write path - fork or own repository, branch, file update,
// Pull Request - against a repository of your own. The write path is the one part of this that a dry run cannot
// exercise, and a release is a poor moment to run it for the first time. A rehearsal waives the guards on what is
// reachable upstream, since the point of it is precisely to run against something that is not.
def upstreamRepo = project.hasProperty('targetRepo') ? project.property('targetRepo').toString() : officialImagesRepo
def rehearsal = upstreamRepo != officialImagesRepo

// What a cycle's 'role' means: the default section comment emitted before that cycle's first block (a cycle may
// override it with its own 'libraryComment', e.g. cycle 16's "- Added back temporarily" annotation), and the wording
// used for it in the Pull Request body. One map for both, so that a role cannot be half-declared - the previous split
// left the Pull Request body free to render an unknown role as 'null' while everything else looked right.
def libraryRoles = [
    'stable': [comment: '# Latest stable', label: 'stable'],
    'intermediate-lts': [comment: '# Intermediate LTS', label: 'intermediate LTS'],
    'lts': [comment: '# LTS', label: 'LTS'],
    'old-lts': [comment: '# Previous LTS', label: 'previous LTS']
]

// Check the roles against that map as soon as the model is read, because they are not only ours: they drive the tags
// and the section comments of the file this script submits to docker-library. An unknown role would silently emit a
// 'null' section header and drop that cycle's stable-*/lts-* tag aliases, and the Pull Request itself is named after
// the single stable cycle. Failing at configuration time beats noticing it in a review upstream.
tokens.each { cycle, data ->
    if (!libraryRoles.containsKey(data.role)) {
        throw new GradleException("Cycle [${cycle}] of [versions.json] declares role [${data.role}], which is not " +
            "one of ${libraryRoles.keySet()}.")
    }
}
def stableCycles = tokens.findAll { cycle, data -> data.role == 'stable' }.keySet()
if (stableCycles.size() != 1) {
    throw new GradleException("Exactly one cycle of [versions.json] must declare the 'stable' role, found " +
        "${stableCycles.isEmpty() ? 'none' : stableCycles}.")
}

// The version tags a cycle contributes, from most to least generic. A major-only cycle key (e.g. '18', version 18.5.0)
// yields [18, 18.5, 18.5.0]; a major.minor key (e.g. '18.4', version 18.4.2) yields [18.4, 18.4.2] (no bare-major tag,
// since another cycle owns the major line).
def libraryVersionPrefixes = { String cycle, String version ->
    def v = version.tokenize('.')
    if (cycle.tokenize('.').size() == 1) {
        return [v[0], "${v[0]}.${v[1]}", version]
    }
    return ["${v[0]}.${v[1]}", version]
}

// The full ordered tag list for one cycle/variant, reproducing the upstream conventions: bare version tags only on the
// default variant; per-variant version tags on every variant; and role-driven aliases (bare variant + stable-/lts- +
// the global stable/latest/lts tags) added only for the stable and LTS cycles.
def libraryTags = { String variant, String db, boolean isDefault, String role, List prefixes ->
    def tags = []
    if (isDefault) {
        tags += prefixes
    }
    tags += prefixes.collect { "${it}-${variant}".toString() }
    if (role == 'stable') {
        tags += variant
        tags += ["stable-${variant}".toString(), "stable-${db}".toString()]
        if (isDefault) {
            tags += ['stable', 'latest']
        }
    } else if (role == 'lts') {
        tags += ["lts-${variant}".toString(), "lts-${db}".toString()]
        if (isDefault) {
            tags += 'lts'
        }
    }
    return tags
}

// The 'GitCommit' of a cycle = the last commit that touched that cycle's directory. docker-library fetches this exact
// commit from GitRepo to (re)build the images, so it only rebuilds cycles whose GitCommit changed.
def libraryGitCommit = { String cycle ->
    return capture(['git', 'log', '-1', '--format=%H', '--', "${cycle}/".toString()])
}

// Generate the complete content of the official Docker library file from the version data model, using the algorithm
// above. Verified to reproduce the currently published file byte for byte, but for the 'GitRepo' line corrected above
// and the 'GitCommit' lines, which resolve to the real per-cycle last-touching commits.
def defaultVariant = dbVariants.keySet().first()
def generateLibraryContent
generateLibraryContent = {
    def sb = new StringBuilder()
    sb << "Maintainers: ${libraryMaintainers}\n"
    sb << "GitRepo: ${libraryGitRepo}\n"
    tokens.each { cycle, data ->
        def prefixes = libraryVersionPrefixes(cycle, data.xwikiVersion)
        def commit = libraryGitCommit(cycle)
        def comment = data.libraryComment ?: libraryRoles[data.role].comment
        sb << "\n${comment}\n"
        def first = true
        dbVariants.each { variant, db ->
            if (!first) {
                sb << '\n'
            }
            first = false
            def tags = libraryTags(variant, db, variant == defaultVariant, data.role, prefixes)
            sb << "Tags: ${tags.join(', ')}\n"
            sb << "Architectures: ${libraryArchitectures}\n"
            sb << "Directory: ${cycle}/${variant}\n"
            sb << "GitCommit: ${commit}\n"
        }
    }
    return sb.toString()
}

// Check that the Docker Build workflow went green on the commit being submitted. docker-library rebuilds the images
// from the GitCommit(s) emitted above, so that workflow is what says they build at all: without this, the first thing
// to notice a Dockerfile that does not build is the upstream Pull Request, in front of the docker-library maintainers.
// The workflow only triggers on the paths the images are made of, so a HEAD that touched none of them has no run of its
// own; the latest run on the release branch then still describes the images being submitted, and that is the one
// checked instead. Finding no run at all is reported but not fatal - refusing to release over a missing run would be a
// guard firing at nothing. '-PskipCiCheck' waives the whole check.
def checkImagesBuild
checkImagesBuild = { String head ->
    if (skipCiCheck) {
        logger.lifecycle("skipCiCheck set: not checking the ${imageWorkflow} result of the submitted commit.")
        return
    }
    def runs = capture(['env', '-u', 'GH_TOKEN', 'gh', 'api',
        "repos/${sourceRepo}/actions/workflows/${imageWorkflow}/runs" +
            "?branch=${libraryGitBranch}&event=push&per_page=20",
        '--jq', '.workflow_runs[] | [.head_sha, .status, .conclusion, .html_url] | @tsv'], true)
        .readLines().collect { it.split('\t', -1) }.findAll { it.size() == 4 }
    def run = runs.find { it[0] == head } ?: (runs.isEmpty() ? null : runs[0])
    if (!run) {
        logger.lifecycle("WARNING: found no ${imageWorkflow} run on ${libraryGitBranch} to check the submitted " +
            'images against; submitting anyway.')
        return
    }
    def which = run[0] == head ? 'of the submitted commit' :
        "on ${libraryGitBranch} (${run[0].take(8)}), the submitted commit having triggered none"
    if (run[1] != 'completed') {
        throw new GradleException("The ${imageWorkflow} run ${which} has not finished (${run[1]}): ${run[3]}. Wait " +
            'for it, or pass -PskipCiCheck to submit anyway.')
    }
    if (run[2] != 'success') {
        throw new GradleException("The ${imageWorkflow} run ${which} did not succeed (${run[2]}): ${run[3]}. The " +
            'images submitted here are the ones it built, so fix it first - or, if it failed on one of the transient ' +
            'download errors that workflow is prone to, pass -PskipCiCheck to submit anyway.')
    }
    logger.lifecycle("The ${imageWorkflow} run ${which} is green (${run[3]}).")
}

// Generate the official Docker library file for xwiki and open a pull request against docker-library/official-images,
// updating the single 'library/xwiki' file on a branch of your GitHub fork (no local clone). Run it AFTER
// './gradlew release' and after you have committed and pushed the docker-xwiki change, so that the emitted GitCommit(s)
// are reachable upstream. Uses 'env -u GH_TOKEN gh' because a GH_TOKEN in the environment cannot create PRs.
// Command line flags: '-PdryRun' to only generate the file and show the diff, without touching your fork or opening a
// PR; '-PtargetRepo=<you>/official-images' to rehearse the write path against a repository of your own;
// '-PskipCiCheck' to submit without the Docker Build workflow having gone green on the commit being submitted.
task submitOfficialImage() {
    group = 'release'
    description = 'Opens the docker-library Pull Request updating the official XWiki images. Run it after pushing.'
    doLast {
        // gh must be authenticated (needed for the upstream fetch below and the PR flow).
        capture(['env', '-u', 'GH_TOKEN', 'gh', 'auth', 'status'])

        // Generate the library file and write it out for review.
        def content = generateLibraryContent()
        def outFile = file('build/library-xwiki')
        outFile.parentFile.mkdirs()
        outFile.text = content

        // Fetch the current upstream file and show a real diff against the generated one.
        def upstreamB64 = capture(['env', '-u', 'GH_TOKEN', 'gh', 'api',
            "repos/${upstreamRepo}/contents/${libraryPath}", '--jq', '.content'])
        def upstreamContent = new String(upstreamB64.replaceAll('\\s', '').decodeBase64(), 'UTF-8')
        if (content == upstreamContent) {
            logger.lifecycle('The generated library file is identical to the upstream one; nothing to submit.')
            return
        }
        def upstreamFile = file('build/library-xwiki.upstream')
        upstreamFile.text = upstreamContent
        def diff = capture(['git', '--no-pager', 'diff', '--no-index', '--',
            upstreamFile.path, outFile.path], true)
        logger.lifecycle("Generated ${libraryPath} (diff upstream -> generated):\n${diff}")

        if (dryRun) {
            logger.lifecycle("dryRun set: wrote ${outFile}; skipping the guards, fork and PR steps.")
            return
        }

        if (rehearsal) {
            logger.lifecycle("targetRepo set: rehearsing the submission against ${upstreamRepo}; the guards on what " +
                'is reachable upstream and on the Docker Build result are skipped.')
        } else {
            // The working tree must be clean and HEAD must be on the branch docker-library fetches: the GitCommit
            // values we emit are the last commits that touched each cycle directory, and docker-library fetches those
            // exact commits from GitRepo, so anything uncommitted, unpushed or pushed somewhere else would not be
            // reachable upstream. Being on some remote branch is not enough, hence the check against that one branch:
            // a commit living only on a Pull Request branch is fetchable by no one but GitHub.
            // Untracked files are deliberately not part of that: a release manager's scratch notes have no bearing on
            // whether the commits we emit are reachable, and refusing to submit because of one is a guard firing at
            // the wrong thing. What matters is that nothing tracked is still uncommitted, hence '--untracked-files=no'.
            def uncommitted = capture(['git', 'status', '--porcelain', '--untracked-files=no'])
            if (!uncommitted.isEmpty()) {
                throw new GradleException('The working tree has uncommitted changes:\n' + uncommitted +
                    '\nCommit and push the docker-xwiki change before running submitOfficialImage.')
            }
            // Refresh the remote-tracking branch first, since it is what the check below reads and it goes stale as
            // soon as the change is pushed from somewhere else (a merged Pull Request, another clone).
            def remote = capture(['git', 'config', "branch.${libraryGitBranch}.remote"], true) ?: 'origin'
            capture(['git', 'fetch', remote, libraryGitBranch])
            def releaseBranch = "${remote}/${libraryGitBranch}"
            def submittedHead = capture(['git', 'rev-parse', 'HEAD'])
            if (capture(['git', 'branch', '-r', '--contains', submittedHead, '--list', releaseBranch]).isEmpty()) {
                throw new GradleException("HEAD (${submittedHead}) is not on ${releaseBranch}, which is where " +
                    "docker-library fetches the images from. Push the docker-xwiki change to ${libraryGitBranch} " +
                    'before running submitOfficialImage.')
            }
            checkImagesBuild(submittedHead)
        }

        // Resolve the GitHub user and the target repository's default branch.
        def login = capture(['env', '-u', 'GH_TOKEN', 'gh', 'api', 'user', '--jq', '.login'])
        def defaultBranch = capture(['env', '-u', 'GH_TOKEN', 'gh', 'api',
            "repos/${upstreamRepo}", '--jq', '.default_branch'])

        // The repository the branch and the file update are pushed to. Normally a fork of the target under your own
        // account, ensured to exist (idempotent) and synced to the target's default branch. GitHub creates a fork
        // asynchronously, so on a first-ever run the sync can arrive before the fork is queryable and fail on a
        // repository that is about to exist; retry it a few times before believing it.
        // When the target is a repository you own - a rehearsal against your own copy - there is nothing to fork, since
        // GitHub does not let you fork your own repository: the branch then lives in the target itself and the Pull
        // Request is opened inside it.
        def fork
        if (upstreamRepo.startsWith("${login}/")) {
            fork = upstreamRepo
            logger.lifecycle("${upstreamRepo} is yours: submitting from a branch of it rather than from a fork.")
        } else {
            fork = "${login}/${upstreamRepo.tokenize('/')[1]}"
            capture(['env', '-u', 'GH_TOKEN', 'gh', 'repo', 'fork', upstreamRepo, '--clone=false'])
            def syncAttempts = 5
            for (int attempt = 1; ; attempt++) {
                try {
                    capture(['env', '-u', 'GH_TOKEN', 'gh', 'repo', 'sync', fork, '--source', upstreamRepo,
                        '--branch', defaultBranch])
                    break
                } catch (GradleException e) {
                    if (attempt >= syncAttempts) {
                        throw e
                    }
                    logger.lifecycle("Syncing ${fork} failed (attempt ${attempt} of ${syncAttempts}); it may still " +
                        'be being created, retrying...')
                    Thread.sleep(5000)
                }
            }
        }

        // The branch and the commit message are named after the stable version. Exactly one cycle carries that role,
        // which the check at the top of this script enforces.
        def stableVersion = tokens.find { cycle, data -> data.role == 'stable' }.value.xwikiVersion
        def branch = "update-xwiki-${stableVersion}"

        // A branch of that name left behind by a previous run is recreated below, but not while a Pull Request is
        // still open from it: deleting the ref would close that Pull Request, and one still being reviewed upstream is
        // not ours to close.
        def openPullRequests = capture(['env', '-u', 'GH_TOKEN', 'gh', 'api',
            "repos/${upstreamRepo}/pulls?state=open&head=${login}:${branch}", '--jq', '.[].html_url'], true)
        if (!openPullRequests.isEmpty()) {
            throw new GradleException("A Pull Request is still open from branch [${branch}]: " +
                "${openPullRequests.readLines().join(', ')}. Let it be merged (or close it) before submitting " +
                'another one.')
        }

        // Create the working branch on the fork off the freshly synced default branch.
        def baseSha = capture(['env', '-u', 'GH_TOKEN', 'gh', 'api',
            "repos/${fork}/git/ref/heads/${defaultBranch}", '--jq', '.object.sha'])
        capture(['env', '-u', 'GH_TOKEN', 'gh', 'api', '-X', 'DELETE',
            "repos/${fork}/git/refs/heads/${branch}"], true)
        capture(['env', '-u', 'GH_TOKEN', 'gh', 'api', '-X', 'POST', "repos/${fork}/git/refs",
            '-f', "ref=refs/heads/${branch}", '-f', "sha=${baseSha}"])

        // Update the single file on that branch via the contents API (needs the current blob sha).
        def fileSha = capture(['env', '-u', 'GH_TOKEN', 'gh', 'api',
            "repos/${fork}/contents/${libraryPath}?ref=${branch}", '--jq', '.sha'])
        def commitMessage = "Update XWiki to ${stableVersion}"
        capture(['env', '-u', 'GH_TOKEN', 'gh', 'api', '-X', 'PUT',
            "repos/${fork}/contents/${libraryPath}",
            '-f', "message=${commitMessage}",
            '-f', "content=${content.bytes.encodeBase64().toString()}",
            '-f', "sha=${fileSha}",
            '-f', "branch=${branch}"])

        // Open the PR against upstream.
        def prBody = 'Update the XWiki official images to the latest releases:\n\n' +
            tokens.collect { cycle, data -> "- `${cycle}` (${libraryRoles[data.role].label}): ${data.xwikiVersion}" }
                .join('\n') + '\n'
        def prUrl = capture(['env', '-u', 'GH_TOKEN', 'gh', 'pr', 'create', '--repo', upstreamRepo,
            '--base', defaultBranch, '--head', "${login}:${branch}",
            '--title', commitMessage, '--body', prBody])
        logger.lifecycle("Opened the ${upstreamRepo} Pull Request: ${prUrl}")
    }
}
