import org.apache.tools.ant.filters.ReplaceTokens

// Run this Gradle build with 'gradle' to generate the various versions and variants from the template directory, plus
// the GitHub Actions workflow that builds them. The versions the images are generated for live in the 'versions.json'
// data file next to this script and are refreshed by the update tasks, so they are not edited by hand anymore.
//
// Note: As a consequence only update the template files and never the generated files!
//
// The build logic is split over several scripts, applied at the end of this file:
// - gradle/helpers.gradle: the HTTP, hashing and process helpers shared by the tasks below.
// - gradle/update-versions.gradle: 'updateXWiki', 'updateJDBC' and 'updateLibreOffice', which refresh 'versions.json'.
// - gradle/run-instances.gradle: 'smokeTest', 'runAll' and 'stopAll', which boot the generated images.
// - gradle/official-image.gradle: 'submitOfficialImage', which opens the DockerHub official-images Pull Request.
// - gradle/release.gradle: the 'release' umbrella chaining the above, and the ordering they need.

defaultTasks 'generate', 'generateWorkflows'

def variants = ['mysql-tomcat', 'mariadb-tomcat', 'postgres-tomcat']

// The version data model: the per-cycle XWiki version + sha256, the per-cycle JDBC driver versions + sha256, and the
// LibreOffice version + one sha256 per CPU architecture (the official image is built for both amd64 and arm64). It is
// kept in the 'versions.json' data file rather than in this script so that the configuration stays separate from the
// build logic and is easy to update programmatically. Each cycle carries:
// - 'role': drives the tag aliases generated for the official Docker library file (see 'submitOfficialImage'). One of
//   'stable', 'lts', 'intermediate-lts', 'old-lts'.
// - 'xwikiVersion' / 'xwikiSha256': the WAR the image downloads, updated by './gradlew updateXWiki'.
// - the per-DB JDBC driver version + sha256: updated by './gradlew updateJDBC' from the cycle's own xwiki-platform POM
//   (i.e. the versions XWiki was tested against, stored per cycle since each cycle may test against different ones).
// - 'tomcatImageTag': the Tomcat and Java versions of the base image for that cycle.
// - 'libraryComment' (optional): overrides the section comment emitted in the official Docker library file.
// The LibreOffice values are shared by all the cycles, since XWiki officially supports a single LibreOffice version,
// the LTS one (aka "Previous Release"), whatever the XWiki version, see
// https://dev.xwiki.org/xwiki/bin/view/Community/SupportStrategy/LibreOfficeSupportStrategy/. Pinning it here means the
// image is not at the mercy of whatever the base image's Debian release ships. It is updated by
// './gradlew updateLibreOffice'.
//
// The artifacts the sha256 are computed from, should you ever need to check one by hand ('sha256sum <file>' on Unix,
// 'shasum --algorithm 256 <file>' on Mac): the XWiki WAR from
// https://nexus.xwiki.org/nexus/content/groups/public/org/xwiki/platform/xwiki-platform-distribution-war, the JDBC
// driver JARs from Maven Central (com.mysql:mysql-connector-j, org.mariadb.jdbc:mariadb-java-client,
// org.postgresql:postgresql) and the LibreOffice archives from
// https://download.documentfoundation.org/libreoffice/stable/.
def versionsFile = file('versions.json')
def versionsConfig = new groovy.json.JsonSlurper().parse(versionsFile)
def tokens = versionsConfig.cycles

// Persist the (possibly updated) version data model back to 'versions.json'. Used by the update tasks instead of
// rewriting a script, so that the configuration and the build logic stay separate.
def writeVersions = {
    versionsFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(versionsConfig)) + '\n'
}

// Expose the model and the variants to the scripts applied at the end of this file, since a script-level 'def' is only
// visible inside the script that declares it. Those scripts bind them back into their own local variables at
// configuration time, so that no task action has to reach for the project while it runs (which Gradle 9 deprecates and
// Gradle 10 removes).
ext.variants = variants
ext.versionsFile = versionsFile
ext.versionsConfig = versionsConfig
ext.tokens = tokens
ext.writeVersions = writeVersions

// The files of 'sourceDirectory' matching 'includes' are copied into 'targetDirectory', evaluating the groovy they
// contain with 'values' as the template bindings.
def expandTemplates = { String sourceDirectory, String targetDirectory, List includes, Map values ->
    copy {
        from sourceDirectory
        into targetDirectory
        includes.each { pattern -> include pattern }
        expand(values)
        filteringCharset = 'UTF-8'
    }
}

task generate() {
    doLast {
        // Copy the template for all versions and variants
        tokens.keySet().each() { version ->
            variants.each() { variant ->
                // Extract the db type and add it as a token
                def (db, servlet) = variant.tokenize('-')
                // The template bindings are the cycle's data plus the variant's db and the LibreOffice values shared
                // by all the cycles. They are a copy, so that the version data model that the update tasks persist to
                // 'versions.json' stays free of these generation-only values.
                def values = tokens[version] + [
                    db: db,
                    libreofficeVersion: versionsConfig.libreoffice.version,
                    libreofficeSha256Amd64: versionsConfig.libreoffice.sha256Amd64,
                    libreofficeSha256Arm64: versionsConfig.libreoffice.sha256Arm64
                ]
                // Copy the common template files plus the ones specific to this variant's db and servlet container
                expandTemplates('template', "${version}/${variant}",
                    ['.env', 'Dockerfile', 'docker-compose.yml', 'xwiki/*', "${db}/*", "${servlet}/*"],
                    values)
            }
        }
    }
}

// The paths that must trigger the Docker Build workflow: the generated Dockerfiles, everything they are generated from,
// and the workflow itself.
def workflowPathFilters = ['*/*/Dockerfile', 'template/**', 'template-github/**', 'build.gradle', 'gradle/*.gradle',
    'versions.json', '.github/workflows/docker-build.yml']

// Generate the GitHub Actions workflow that builds the images. Its build matrix lists all the versions and variants, so
// generating it from the same definitions as the images keeps it in sync instead of having to be updated by hand
// whenever a cycle is added or removed.
task generateWorkflows() {
    doLast {
        expandTemplates('template-github', '.github/workflows', ['docker-build.yml'], [
            versionMatrix: tokens.keySet().collect { "'$it'" }.join(', '),
            variantMatrix: variants.collect { "'$it'" }.join(', '),
            pathFilters: workflowPathFilters.collect { "      - '$it'" }.join('\n')
        ])
    }
}

apply from: 'gradle/helpers.gradle'
apply from: 'gradle/update-versions.gradle'
apply from: 'gradle/run-instances.gradle'
apply from: 'gradle/official-image.gradle'
apply from: 'gradle/release.gradle'
